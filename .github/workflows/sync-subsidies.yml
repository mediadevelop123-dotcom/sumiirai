name: Sync Subsidies Weekly

on:
  schedule:
    # 毎週月曜日 JST 11:00 (UTC 02:00) に実行
    - cron: '0 2 * * 1'
  # 手動実行ボタン(GitHub UI から即時実行可能)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run subsidy sync
        run: npx tsx scripts/sync-subsidies.ts
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER:              bedrock
          AWS_REGION:                ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Notify on failure
        if: failure()
        # Lark Webhook で失敗通知(Phase 2以降: 実際のWebhook URLをシークレットに設定)
        run: |
          curl -X POST "${{ secrets.LARK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"❌ 補助金同期スクリプト失敗\nリポジトリ: ${{ github.repository }}\nログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}'
        continue-on-error: true
